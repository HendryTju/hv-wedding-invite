<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#385438" />
      <stop offset="100%" stop-color="#283d28" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Subtle ornate golden border -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Monogram HV Text -->
  <text x="32" y="44" 
        font-family="Georgia, 'Times New Roman', 'Cormorant Garamond', serif" 
        font-size="34" 
        font-weight="bold" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="0.5">HV</text>
</svg>
